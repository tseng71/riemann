[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta-simple-zeros"
version = "0.3.0"
description = "Certified seven-point candidate refinement of the simple critical-line zeta-zero bound to 67.30254768%"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "ainta", email = "ainta98@gmail.com" }]
dependencies = ["python-flint==0.8.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
zeta-zero-verify = "zeta_simple_zeros.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
